<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Кибер-Расписание</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div id="pull-indicator" class="pull-indicator">
        <svg id="pull-svg" viewBox="0 0 24 24">
            <path d="M12 4V1l-4 4 4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
        </svg>
    </div>
    <div id="outdated-badge" class="outdated-badge">
        <span>Данные устарели. Потяните вниз для обновления</span>
    </div>
    <div class="swiper-container" id="swiper">
        <!-- Слайд Дня -->
        <div class="slide" id="slide-day">
            <div class="header-widget">
                <h1>Расписание <span class="switch-name-link" id="user-name-trigger">Кирилла</span><button id="music-toggle-btn" class="music-btn">🎵</button></h1>
            </div>
            <div class="timer-card" id="timer-card">
                <div class="timer-status" id="timer-label">Загрузка...</div>
                <div class="timer-countdown" id="timer-time">00:00</div>
                <div class="timer-sub" id="timer-sub">Анализ текущего времени...</div>
            </div>
            <div class="day-schedule-box">
                <div class="day-title" id="day-title">Сегодня</div>
                <div class="lessons-list" id="day-lessons"></div>
            </div>
        </div>
        <!-- Слайд Недели -->
        <div class="slide" id="slide-week">
            <div class="header-widget">
                <h1>Матрица недели</h1>
            </div>
            <div class="week-matrix-box">
                <div class="matrix-grid" id="matrix-grid"></div>
            </div>
        </div>
    </div>
    <div class="navigation-tabs">
        <div class="nav-carriage" id="nav-carriage"></div>
        <button class="tab-btn active" onclick="switchScreen(0)">День</button>
        <button class="tab-btn" onclick="switchScreen(1)">Неделя</button>
    </div>
    <script src="script.js?v=20"></script>
</body>
</html>
