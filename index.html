<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Расписание 2026</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?=15">
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="pull-indicator" class="pull-indicator">
        <svg id="pull-svg" viewBox="0 0 24 24">
            <path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6a5.87 5.87 0 01-2.8-.7l-1.46 1.46A7.93 7.93 0 0012 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46A7.93 7.93 0 0012 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/>
        </svg>
    </div>

    <div id="outdated-badge" class="outdated-badge">
        <span>Информация устарела. Потяните вниз для обновления</span>
    </div>

    <div id="swiper" class="swiper-container">
        <!-- СЛАЙД: ДЕНЬ -->
        <div id="slide-day" class="slide">
            <div class="header-widget">
                <!-- ДОБАВЛЕНА КНОПКА МУЗЫКАЛКИ 🎵 -->
                <h1 style="display: flex; align-items: center; justify-content: center; gap: 12px;">
                    <span>Расписание</span>
                    <span id="user-link" class="switch-name-link">Кирилла</span>
                    <button id="music-toggle-btn" class="music-toggle-btn" onclick="toggleMusicMode()">🎵</button>
                </h1>
            </div>

            <div class="timer-card" id="timer-card">
                <div class="timer-status" id="timer-label">Загрузка...</div>
                <div class="timer-countdown" id="timer-time">00:00</div>
                <div class="timer-sub" id="timer-sub">анализ...</div>
            </div>

            <div class="day-schedule-box">
                <div class="day-title" id="day-title">Сегодня</div>
                <div class="lessons-list" id="day-lessons">
                    <!-- Уроки генерируются из JS -->
                </div>
            </div>
        </div>

        <!-- СЛАЙД: НЕДЕЛЯ -->
        <div id="slide-week" class="slide">
            <div class="header-widget">
                <h1 id="week-header-title">Вся неделя</h1>
            </div>
            <div class="week-matrix-box">
                <div id="matrix-grid" class="matrix-grid">
                    <!-- Матрица генерируется из JS -->
                </div>
            </div>
        </div>
    </div>

    <div class="navigation-tabs">
        <div id="nav-carriage" class="nav-carriage"></div>
        <button class="tab-btn active" onclick="switchScreen(0)">День</button>
        <button class="tab-btn" onclick="switchScreen(1)">Неделя</button>
    </div>

    <script src="script.js?v=16"></script>
</body>
</html>
